name: Descargar imágenes del sitio actual

# Corre scripts/fetch-assets.mjs y commitea en la misma rama todo lo que bajó a public/.
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch-assets.mjs"
      - ".github/workflows/fetch-assets.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar assets
        run: node scripts/fetch-assets.mjs
      - name: Commitear public/
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add public scripts/fetch-assets-report.txt
          if git diff --cached --quiet; then
            echo "No hay archivos nuevos."
          else
            git commit -m "chore: descargar imágenes y documentos a public/"
            git push
          fi
